# ==========================================
# D2-12: OpenSearch StatefulSet
# Namespace: soc
# ==========================================

# 1. 애플리케이션 접근용 Service
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: soc
  labels:
    app: opensearch
spec:
  type: ClusterIP
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP

---
# 2. StatefulSet Pod 식별용 Headless Service
apiVersion: v1
kind: Service
metadata:
  name: opensearch-headless
  namespace: soc
  labels:
    app: opensearch
spec:
  clusterIP: None
  selector:
    app: opensearch
  ports:
    - name: transport
      port: 9300
      targetPort: 9300
      protocol: TCP

---
# 3. OpenSearch StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: soc
  labels:
    app: opensearch
spec:
  serviceName: opensearch-headless
  replicas: 1

  selector:
    matchLabels:
      app: opensearch

  template:
    metadata:
      labels:
        app: opensearch
    spec:
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300

          # OpenSearch 실행 설정
          env:
            - name: discovery.type
              value: "single-node"

            - name: DISABLE_SECURITY_PLUGIN
              value: "true"

            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"

            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms2g -Xmx2g"

          # D2-11 용량 산정 결과
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              memory: "4Gi"

          # OpenSearch 준비 상태 확인
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          # OpenSearch 데이터 저장 경로
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data

  # 4. Pod별 영구 저장 공간 요청
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi